    <rect x="0" y="280" width="1200" height="40" fill="#C97A3D"/>
    <rect x="0" y="280" width="1200" height="10" fill="#3FA34D"/>
    <g fill="#8A5223" opacity="0.5">
      <rect x="0" y="292" width="30" height="6"/>
      <rect x="40" y="292" width="30" height="6"/>
      <rect x="80" y="292" width="30" height="6"/>
      <rect x="120" y="292" width="30" height="6"/>
      <rect x="160" y="292" width="30" height="6"/>
      <rect x="200" y="292" width="30" height="6"/>
      <rect x="240" y="292" width="30" height="6"/>
      <rect x="280" y="292" width="30" height="6"/>
      <rect x="320" y="292" width="30" height="6"/>
      <rect x="360" y="292" width="30" height="6"/>
      <rect x="400" y="292" width="30" height="6"/>
      <rect x="440" y="292" width="30" height="6"/>
      <rect x="480" y="292" width="30" height="6"/>
      <rect x="520" y="292" width="30" height="6"/>
      <rect x="560" y="292" width="30" height="6"/>
      <rect x="600" y="292" width="30" height="6"/>
      <rect x="640" y="292" width="30" height="6"/>
      <rect x="680" y="292" width="30" height="6"/>
      <rect x="720" y="292" width="30" height="6"/>
      <rect x="760" y="292" width="30" height="6"/>
      <rect x="800" y="292" width="30" height="6"/>
      <rect x="840" y="292" width="30" height="6"/>
      <rect x="880" y="292" width="30" height="6"/>
      <rect x="920" y="292" width="30" height="6"/>
      <rect x="960" y="292" width="30" height="6"/>
      <rect x="1000" y="292" width="30" height="6"/>
      <rect x="1040" y="292" width="30" height="6"/>
      <rect x="1080" y="292" width="30" height="6"/>
      <rect x="1120" y="292" width="30" height="6"/>
      <rect x="1160" y="292" width="30" height="6"/>
    </g>
  </g>

  <!-- coins -->
  <g fill="#FFD700" stroke="#B8860B" stroke-width="2">
    <rect x="440" y="220" width="18" height="18"/>
    <rect x="470" y="220" width="18" height="18"/>
    <rect x="500" y="220" width="18" height="18"/>
  </g>

  <!-- title text, pixel style -->
  <text x="600" y="120" font-family="'Courier New', monospace" font-size="56" font-weight="bold"
        fill="#FFFFFF" stroke="#1C3D6B" stroke-width="6" paint-order="stroke" text-anchor="middle">
    ADIT.EXE
  </text>
  <text x="600" y="150" font-family="'Courier New', monospace" font-size="18"
        fill="#FFEB3B" stroke="#7A4B1E" stroke-width="3" paint-order="stroke" text-anchor="middle">
    PLAYER ONE  ||  WORLD 1-1
  </text>
</svg>
