  <!-- warp pipe -->
  <g>
    <rect x="1020" y="200" width="80" height="20" fill="#2E9E4A" stroke="#1C6B31" stroke-width="4"/>
    <rect x="1030" y="220" width="60" height="60" fill="#3FBE5B" stroke="#1C6B31" stroke-width="4"/>
