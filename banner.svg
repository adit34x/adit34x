<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- sky -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C94FC"/>
      <stop offset="100%" stop-color="#9FD3FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#sky)"/>

  <!-- sun -->
  <g fill="#FFEB3B">
    <rect x="1080" y="30" width="60" height="60"/>
    <rect x="1060" y="50" width="20" height="20"/>
    <rect x="1140" y="50" width="20" height="20"/>
    <rect x="1060" y="80" width="20" height="20"/>
    <rect x="1140" y="80" width="20" height="20"/>
  </g>

  <!-- clouds -->
  <g fill="#FFFFFF">
    <rect x="80" y="50" width="80" height="24"/>
    <rect x="60" y="66" width="120" height="20"/>
    <rect x="100" y="34" width="40" height="20"/>

    <rect x="420" y="90" width="70" height="20"/>
    <rect x="400" y="104" width="110" height="18"/>
    <rect x="440" y="76" width="34" height="18"/>

    <rect x="780" y="40" width="70" height="20"/>
    <rect x="760" y="54" width="110" height="18"/>
    <rect x="800" y="26" width="34" height="18"/>
  </g>

  <!-- distant hills -->
  <g fill="#3FA34D">
    <rect x="0" y="200" width="60" height="20"/>
    <rect x="20" y="180" width="60" height="20"/>
    <rect x="40" y="160" width="60" height="20"/>
    <rect x="60" y="140" width="40" height="20"/>

    <rect x="900" y="210" width="60" height="20"/>
    <rect x="920" y="190" width="60" height="20"/>
    <rect x="940" y="170" width="60" height="20"/>
    <rect x="960" y="150" width="40" height="20"/>
  </g>

  <!-- bushes -->
  <g fill="#2E9E4A">
    <rect x="180" y="228" width="40" height="20"/>
    <rect x="160" y="240" width="80" height="20"/>
    <rect x="200" y="216" width="40" height="20"/>

    <rect x="620" y="228" width="40" height="20"/>
    <rect x="600" y="240" width="80" height="20"/>
    <rect x="640" y="216" width="40" height="20"/>
  </g>

  <!-- floating blocks -->
  <g>
    <rect x="260" y="150" width="36" height="36" fill="#E4A93B" stroke="#7A4B1E" stroke-width="3"/>
    <text x="278" y="176" font-family="monospace" font-size="20" fill="#7A4B1E" text-anchor="middle" font-weight="bold">?</text>

    <rect x="308" y="150" width="36" height="36" fill="#E4A93B" stroke="#7A4B1E" stroke-width="3"/>
    <text x="326" y="176" font-family="monospace" font-size="20" fill="#7A4B1E" text-anchor="middle" font-weight="bold">?</text>

    <rect x="860" y="130" width="36" height="36" fill="#C97A3D" stroke="#6B3E1B" stroke-width="3"/>
    <rect x="908" y="130" width="36" height="36" fill="#C97A3D" stroke="#6B3E1B" stroke-width="3"/>
    <rect x="956" y="130" width="36" height="36" fill="#E4A93B" stroke="#7A4B1E" stroke-width="3"/>
    <text x="974" y="156" font-family="monospace" font-size="20" fill="#7A4B1E" text-anchor="middle" font-weight="bold">?</text>
