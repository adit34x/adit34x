<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5C94FC"/>
      <stop offset="100%" stop-color="#9FD3FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#sky)"/>

  <!-- sun -->
  <g fill="#FFEB3B">
    <rect x="1080" y="30" width="60" height="60"/>
    <rect x="1060" y="50" width="20" height="20"/>
    <rect x="1140" y="50" width="20" height="20"/>
    <rect x="1060" y="80" width="20" height="20"/>
    <rect x="1140" y="80" width="20" height="20"/>
  </g>

  <!-- clouds -->
  <g fill="#FFFFFF">
    <rect x="80" y="50" width="80" height="24"/>
    <rect x="60" y="66" width="120" height="20"/>
    <rect x="100" y="34" width="40" height="20"/>

    <rect x="420" y="90" width="70" height="20"/>
    <rect x="400" y="104" width="110" height="18"/>
    <rect x="440" y="76" width="34" height="18"/>

    <rect x="780" y="40" width="70" height="20"/>
    <rect x="760" y="54" width="110" height="18"/>
    <rect x="800" y="26" width="34" height="18"/>
  </g>

  <!-- distant hills -->
  <g fill="#3FA34D">
    <rect x="0" y="200" width="60" height="20"/>
    <rect x="20" y="180" width="60" height="20"/>
    <rect x="40" y="160" width="60" height="20"/>
    <rect x="60" y="140" width="40" height="20"/>

    <rect x="900" y="210" width="60" height="20"/>
    <rect x="920" y="190" width="60" height="20"/>
    <rect x="940" y="170" width="60" height="20"/>
    <rect x="960" y="150" width="40" height="20"/>
  </g>

  <!-- bushes -->
  <g fill="#2E9E4A">
    <rect x="180" y="228" width="40" height="20"/>
    <rect x="160" y="240" width="80" height="20"/>
    <rect x="200" y="216" width="40" height="20"/>

    <rect x="620" y="228" width="40" height="20"/>
    <rect x="600" y="240" width="80" height="20"/>
    <rect x="640" y="216" width="40" height="20"/>
  </g>

  <!-- floating blocks -->
  <g>
    <rect x="260" y="150" width="36" height="36" fill="#E4A93B" stroke="#7A4B1E" stroke-width="3"/>
    <text x="278" y="176" font-family="monospace" font-size="20" fill="#7A4B1E" text-anchor="middle" font-weight="bold">?</text>

    <rect x="308" y="150" width="36" height="36" fill="#E4A93B" stroke="#7A4B1E" stroke-width="3"/>
    <text x="326" y="176" font-family="monospace" font-size="20" fill="#7A4B1E" text-anchor="middle" font-weight="bold">?</text>

    <rect x="860" y="130" width="36" height="36" fill="#C97A3D" stroke="#6B3E1B" stroke-width="3"/>
    <rect x="908" y="130" width="36" height="36" fill="#C97A3D" stroke="#6B3E1B" stroke-width="3"/>
    <rect x="956" y="130" width="36" height="36" fill="#E4A93B" stroke="#7A4B1E" stroke-width="3"/>
    <text x="974" y="156" font-family="monospace" font-size="20" fill="#7A4B1E" text-anchor="middle" font-weight="bold">?</text>
  </g>

  <!-- warp pipe -->
  <g>
    <rect x="1020" y="200" width="80" height="20" fill="#2E9E4A" stroke="#1C6B31" stroke-width="4"/>
    <rect x="1030" y="220" width="60" height="60" fill="#3FBE5B" stroke="#1C6B31" stroke-width="4"/>
  </g>

  <!-- ground -->
  <g>
    <rect x="0" y="280" width="1200" height="40" fill="#C97A3D"/>
    <rect x="0" y="280" width="1200" height="10" fill="#3FA34D"/>
    <g fill="#8A5223" opacity="0.5">
      <rect x="0" y="292" width="30" height="6"/>
      <rect x="40" y="292" width="30" height="6"/>
      <rect x="80" y="292" width="30" height="6"/>
      <rect x="120" y="292" width="30" height="6"/>
      <rect x="160" y="292" width="30" height="6"/>
      <rect x="200" y="292" width="30" height="6"/>
      <rect x="240" y="292" width="30" height="6"/>
      <rect x="280" y="292" width="30" height="6"/>
      <rect x="320" y="292" width="30" height="6"/>
      <rect x="360" y="292" width="30" height="6"/>
      <rect x="400" y="292" width="30" height="6"/>
      <rect x="440" y="292" width="30" height="6"/>
      <rect x="480" y="292" width="30" height="6"/>
      <rect x="520" y="292" width="30" height="6"/>
      <rect x="560" y="292" width="30" height="6"/>
      <rect x="600" y="292" width="30" height="6"/>
      <rect x="640" y="292" width="30" height="6"/>
      <rect x="680" y="292" width="30" height="6"/>
      <rect x="720" y="292" width="30" height="6"/>
      <rect x="760" y="292" width="30" height="6"/>
      <rect x="800" y="292" width="30" height="6"/>
      <rect x="840" y="292" width="30" height="6"/>
      <rect x="880" y="292" width="30" height="6"/>
      <rect x="920" y="292" width="30" height="6"/>
      <rect x="960" y="292" width="30" height="6"/>
      <rect x="1000" y="292" width="30" height="6"/>
      <rect x="1040" y="292" width="30" height="6"/>
      <rect x="1080" y="292" width="30" height="6"/>
      <rect x="1120" y="292" width="30" height="6"/>
      <rect x="1160" y="292" width="30" height="6"/>
    </g>
  </g>

  <!-- coins -->
  <g fill="#FFD700" stroke="#B8860B" stroke-width="2">
    <rect x="440" y="220" width="18" height="18"/>
    <rect x="470" y="220" width="18" height="18"/>
    <rect x="500" y="220" width="18" height="18"/>
  </g>

  <!-- title text -->
  <text x="600" y="90" font-family="'Courier New', monospace" font-size="52" font-weight="bold"
        fill="#FFFFFF" stroke="#1C3D6B" stroke-width="6" paint-order="stroke" text-anchor="middle">
    ADIT.EXE
  </text>
  <text x="600" y="118" font-family="'Courier New', monospace" font-size="17"
        fill="#FFEB3B" stroke="#7A4B1E" stroke-width="3" paint-order="stroke" text-anchor="middle">
    PLAYER ONE  ||  WORLD 1-1
  </text>

  <!-- animated runner: whole group loops left-to-right, legs alternate for a run cycle -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
      values="-60,0; 1260,0" keyTimes="0;1" dur="6s" repeatCount="indefinite"/>

    <g transform="translate(0,224)">
      <!-- back leg (swings) -->
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="rotate"
          values="25 30 60; -25 30 60; 25 30 60" keyTimes="0;0.5;1" dur="0.35s" repeatCount="indefinite"/>
        <rect x="18" y="60" width="16" height="20" fill="#3A6A87"/>
        <rect x="16" y="78" width="20" height="8" fill="#6B3E1B"/>
      </g>
      <!-- front leg (swings opposite) -->
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="rotate"
          values="-25 30 60; 25 30 60; -25 30 60" keyTimes="0;0.5;1" dur="0.35s" repeatCount="indefinite"/>
        <rect x="34" y="60" width="16" height="20" fill="#457B9D"/>
        <rect x="32" y="78" width="20" height="8" fill="#6B3E1B"/>
      </g>
      <!-- body bob -->
      <g>
        <animateTransform attributeName="transform" attributeType="XML" type="translate"
          values="0,0; 0,-4; 0,0" keyTimes="0;0.5;1" dur="0.35s" repeatCount="indefinite"/>
        <!-- torso / overalls -->
        <rect x="14" y="28" width="42" height="26" fill="#457B9D"/>
        <rect x="14" y="28" width="42" height="8" fill="#3A6A87"/>
        <rect x="24" y="36" width="6" height="6" fill="#FFD700"/>
        <rect x="42" y="36" width="6" height="6" fill="#FFD700"/>
        <!-- arms -->
        <rect x="2" y="30" width="10" height="18" fill="#F1C27D"/>
        <rect x="58" y="30" width="10" height="18" fill="#F1C27D"/>
        <!-- head -->
        <rect x="16" y="8" width="38" height="20" fill="#F1C27D"/>
        <rect x="34" y="14" width="6" height="6" fill="#222222"/>
        <!-- cap -->
        <rect x="12" y="-6" width="42" height="12" fill="#E63946"/>
        <rect x="4" y="4" width="58" height="8" fill="#E63946"/>
        <rect x="20" y="-2" width="16" height="8" fill="#FFFFFF"/>
      </g>
    </g>
  </g>
</svg>
